[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-hub"
version = "0.1.0"
description = "CampusHub: платформа самообслуживания университетского кампуса"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy==2.0.44",
    "psycopg[binary]==3.2.12",
    "kafka-python==2.3.3",
]

[project.optional-dependencies]
dev = [
    "behave==1.3.3",
    "pre-commit==4.6.2",
    "pytest==8.4.2",
    "factory-boy==3.3.3",
    "testcontainers[postgres,kafka]==4.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Docker to run PostgreSQL and Kafka"]
