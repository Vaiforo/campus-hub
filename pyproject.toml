[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-hub"
version = "0.1.0"
description = "CampusHub: платформа самообслуживания университетского кампуса"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "behave==1.3.3",
    "pre-commit==4.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]
